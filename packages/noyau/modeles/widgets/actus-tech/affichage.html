<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Articles</title>
<style>
  :root { color-scheme: light dark; --fond: #ffffff; --texte: #1c1c1e; --doux: #6b6b70; --lien: #0b57d0; --trait: #e4e4e7; }
  @media (prefers-color-scheme: dark) { :root { --fond: #1c1c1e; --texte: #f2f2f4; --doux: #9a9aa2; --lien: #8ab4f8; --trait: #3a3a3e; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte); font: 13px/1.35 system-ui, -apple-system, sans-serif; }
  body { padding: 8px 10px; overflow: auto; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 5px 0; border-bottom: 1px solid var(--trait); }
  li:last-child { border-bottom: 0; }
  button.titre { all: unset; cursor: pointer; font-weight: 600; color: var(--lien); display: block; }
  button.titre:hover, button.titre:focus-visible { text-decoration: underline; }
  .inerte { font-weight: 600; }
  .source { color: var(--doux); font-size: 11px; }
  .resume { margin: 2px 0 0; color: var(--texte); font-size: 12px; }
  .vide { color: var(--doux); }
  body.etroit .resume, body.etroit .source { display: none; }
</style>
</head>
<body class="etroit">
<ul id="liste"></ul>
<script>
  function afficher(m) {
    const donnees = m.donnees || {};
    const articles = Array.isArray(donnees.articles) ? donnees.articles : [];
    const large = (m.px && m.px.largeur >= 360) || (m.taille && m.taille.l >= 4) || (m.px && m.px.hauteur >= 300);
    document.body.className = large ? "large" : "etroit";
    const liste = document.getElementById("liste");
    liste.replaceChildren();
    if (!articles.length) {
      const li = document.createElement("li");
      li.className = "vide";
      li.textContent = "Aucun article pour le moment.";
      liste.append(li);
      return;
    }
    for (const a of articles) {
      const li = document.createElement("li");
      const url = String(a.url ?? "");
      let ouvrable = false;
      try { const pr = new URL(url).protocol; ouvrable = pr === "http:" || pr === "https:"; } catch {}
      if (ouvrable) {
        const b = document.createElement("button");
        b.className = "titre";
        b.type = "button";
        b.textContent = String(a.titre ?? "");
        b.addEventListener("click", () => parent.postMessage({ type: "ouvrir", url }, "*"));
        li.append(b);
      } else {
        const t = document.createElement("div");
        t.className = "titre inerte";
        t.textContent = String(a.titre ?? "");
        li.append(t);
      }
      if (a.source) {
        const s = document.createElement("div");
        s.className = "source";
        s.textContent = String(a.source);
        li.append(s);
      }
      if (a.resume) {
        const p = document.createElement("p");
        p.className = "resume";
        p.textContent = String(a.resume);
        li.append(p);
      }
      liste.append(li);
    }
  }
  addEventListener("message", (e) => { if (e.source === parent && e.data && e.data.type === "widget") afficher(e.data); });
</script>
</body>
</html>
