<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<style>
  :root { color-scheme: light dark; --background: #ffffff; --text: #1c1c1e; --muted: #6b6b70; --line: #e4e4e7; }
  @media (prefers-color-scheme: dark) { :root { --background: #1c1c1e; --text: #f2f2f4; --muted: #9a9aa2; --line: #3a3a3e; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--background); color: var(--text); font: 13px/1.3 system-ui, -apple-system, sans-serif; }
  body { padding: 10px 12px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
  .city { color: var(--muted); font-size: 12px; }
  .current { display: flex; align-items: baseline; gap: 10px; }
  .temp { font-size: 34px; font-weight: 600; line-height: 1; }
  .label { font-size: 14px; }
  .row { display: flex; gap: 10px; overflow-x: auto; padding-top: 6px; border-top: 1px solid var(--line); }
  .cell { flex: 0 0 auto; text-align: center; min-width: 52px; }
  .cell small { display: block; color: var(--muted); font-size: 11px; }
  .days { display: flex; flex-direction: column; gap: 3px; padding-top: 6px; border-top: 1px solid var(--line); }
  .day { display: flex; justify-content: space-between; gap: 8px; }
  .day span:last-child { color: var(--muted); white-space: nowrap; }
  .message { color: var(--muted); font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="no-city" class="message" hidden>Tell the agent your city (for example: “my city is London”)</div>
<div id="weather" hidden>
  <div class="city" id="city"></div>
  <div class="current"><span class="temp" id="temp"></span><span class="label" id="label"></span></div>
</div>
<div class="row" id="hours" hidden></div>
<div class="days" id="days" hidden></div>
<script>
  const $ = (id) => document.getElementById(id);
  const deg = (n) => Math.round(Number(n)) + "°";
  const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  function dayName(date) {
    const d = new Date(String(date) + "T12:00:00");
    return isNaN(d) ? String(date) : DAYS[d.getDay()];
  }
  function render(m) {
    const d = m.data || {};
    const hasCity = typeof d.ville === "string" && d.ville && d.actuel;
    $("no-city").hidden = !!hasCity;
    $("weather").hidden = !hasCity;
    $("hours").hidden = true;
    $("days").hidden = true;
    if (!hasCity) return;
    $("city").textContent = d.ville;
    $("temp").textContent = deg(d.actuel.temperature);
    $("label").textContent = String(d.actuel.libelle ?? "");
    const l = (m.size && m.size.w) || 0, h = (m.size && m.size.h) || 0;
    if (l >= 4 && Array.isArray(d.heures) && d.heures.length) {
      const zone = $("hours");
      zone.replaceChildren();
      for (const x of d.heures) {
        const c = document.createElement("div");
        c.className = "cell";
        const t = document.createElement("div");
        t.textContent = deg(x.temperature);
        const s = document.createElement("small");
        s.textContent = String(x.heure ?? "");
        c.append(t, s);
        c.title = String(x.libelle ?? "");
        zone.append(c);
      }
      zone.hidden = false;
    }
    if (h >= 3 && Array.isArray(d.jours) && d.jours.length) {
      const zone = $("days");
      zone.replaceChildren();
      for (const j of d.jours) {
        const r = document.createElement("div");
        r.className = "day";
        const a = document.createElement("span");
        a.textContent = dayName(j.date) + " " + String(j.libelle ?? "");
        const b = document.createElement("span");
        b.textContent = deg(j.min) + " / " + deg(j.max);
        r.append(a, b);
        zone.append(r);
      }
      zone.hidden = false;
    }
  }
  // Firefox: a sandboxed resource:// frame does not see parent, e.source === parent is false there.
  addEventListener("message", (e) => { if (e.data && e.data.type === "widget") render(e.data); });
</script>
</body>
</html>
