version: 1
rules:
  # It flags "why" comments ("Replaces…", "Tests: …") and `aislop fix` deletes them.
  ai-slop/narrative-comment: "off"
  # `for (const x of [...set])` is a snapshot: the loop removes items or listeners unsubscribe while iterating.
  unicorn/no-useless-spread: "off"
  # House style: `a ? f() : g()` and `x = 1, reply()` as statements.
  eslint/no-unused-expressions: "off"
overrides:
  # Svelte 5 runes ($state, $derived) are compiler globals in .svelte.ts modules.
  - files: ["**/*.svelte.ts"]
    rules:
      eslint/no-undef: "off"
  # Firefox pref files: pref() is provided by the pref parser, they are not JavaScript modules.
  - files: ["apps/firefox/src/browser/**/pref/*.js", "apps/firefox/src/browser/app/profile/*.js"]
    rules:
      eslint/no-undef: "off"
