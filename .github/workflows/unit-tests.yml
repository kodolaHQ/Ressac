name: Unit tests
# Unit tests and typecheck of every package on each push to main and each pull request.
# The e2e suite needs a built engine, which the free runner cannot build: it stays on the maintainer's Mac.
on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      # One package at a time: kernel and Firefox tests together overload the 3-core runner (timeouts).
      - run: corepack pnpm -r --workspace-concurrency=1 --if-present test
