<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      img-src élargi à https: et http: : les favicons des sites sont chargés directement par l'interface.
      Décision assumée : une image ne peut pas exécuter de code ; le prix est que le site d'un favicon voit
      l'adresse IP de l'utilisateur, comme lors de la visite elle-même. Scripts et styles restent limités à 'self'.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:" />
    <title>WebAiOs</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
