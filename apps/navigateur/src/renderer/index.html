<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      L'interface ne charge rien du web (sa session n'a pas de réseau, voir main/reseau-interface.ts) : les favicons des
      sites passent par webaios-icone:, que le process principal va chercher (le site voit l'adresse IP de l'utilisateur,
      comme lors de la visite elle-même). Scripts et styles restent limités à 'self'.
      crx: : les icônes des boutons d'extension, servies par la bibliothèque des extensions (main/extensions/sessions.ts).
      frame-src : seuls les affichages des widgets de la page d'accueil (protocole webaios-widget:, voir main/agent/accueil.ts).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: webaios-icone: crx:; frame-src webaios-widget:" />
    <title>WebAiOs</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
