<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Interface d'une fenêtre d'appli de site : la barre. Elle ne charge rien du web (le site est dans une vue à part,
      de sa propre session) ; son seul cadre est l'écran d'accueil de l'appli (webaios-site:, sans réseau).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src webaios-site:" />
    <title>Appli de site</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./site/main.ts"></script>
  </body>
</html>
