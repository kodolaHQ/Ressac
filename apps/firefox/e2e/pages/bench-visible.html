<!doctype html><meta charset="utf-8"><title>bench</title>
<p>Bench page.</p>
<script>
  // "n<i>" once loaded; "v<wall clock ms>" at the 2nd frame after the page is shown again (the benches' end signal).
  // With "cold", also at the 2nd frame after a load in a visible tab (a tab created on its first activation).
  const params = new URLSearchParams(location.search);
  document.title = "n" + params.get("n");
  const shown = () =>
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.title = "v" + Math.round(performance.timeOrigin + performance.now());
    }));
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") shown();
  });
  if (params.has("cold") && document.visibilityState === "visible") shown();
</script>
